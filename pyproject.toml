[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-dbt-macros"
version = "0.2.1"
description = "Unit-test dbt macros (Jinja) with pytest, without dbt-core, an adapter, profiles.yml or a database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1", "pyyaml>=6", "pytest>=7", "sqlglot>=25"]
keywords = ["dbt", "dbt-macros", "pytest", "pytest-plugin", "jinja", "unit-testing", "analytics-engineering", "sql"]
classifiers = [
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://start-up-team-k.github.io/pytest-dbt-macros/"
Repository = "https://github.com/start-up-team-k/pytest-dbt-macros"
Issues = "https://github.com/start-up-team-k/pytest-dbt-macros/issues"
Changelog = "https://github.com/start-up-team-k/pytest-dbt-macros/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
dbt_macros = "pytest_dbt_macros.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_dbt_macros"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "LICENSE", "NOTICE", "README.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
