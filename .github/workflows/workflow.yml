# Publishes to PyPI via Trusted Publishing. Manual only: it needs the maintainer to configure
# a Trusted Publisher on PyPI (project pytest-dbt-macros, this repo, workflow workflow.yml, environment `pypi`).
name: Release to PyPI
on: workflow_dispatch
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
