name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - name: dbt-core must NOT be installed
        run: python -c "import dbt" && exit 1 || echo "dbt not installed"
      - run: pytest -v
      - name: dbt still not imported after the tests
        run: pip list | grep -i -E "^dbt" && exit 1 || echo "no dbt packages installed"
